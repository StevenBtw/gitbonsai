name: Release

on:
  push:
    tags: ['v*']

# Read-only by default: the build jobs run dependency build scripts, so only
# the publishing job gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # One archive per target with the binary at its root, plus its checksum:
      # gitbonsai-<target>.tar.gz (zip on Windows) and gitbonsai-<target>.<ext>.sha256
      - name: Package
        shell: bash
        run: |
          name="gitbonsai-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            (cd "$dir" && 7z a "../../../$archive" gitbonsai.exe > /dev/null)
            sha256sum "$archive" > "$archive.sha256"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" -C "$dir" gitbonsai
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      # A draft takes the assets, then publishing makes the release
      # immutable and attested, which the action verifies on download.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Release by pushing only the tag. A release published by hand locks
        # before the assets arrive, so one that already exists is an error.
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; push only the tag and let this job create the release"
            exit 1
          fi
          # The draft is addressed by its id throughout: a draft's tag does
          # not exist until it is published.
          id=$(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f name="Release ${TAG#v}" \
            -F draft=true -F generate_release_notes=true --jq .id)
          for f in gitbonsai-*; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$f" \
              --input "$f" --jq .name
          done
          gh api --method PATCH "repos/$REPO/releases/$id" -F draft=false --jq .html_url
          want=$(ls gitbonsai-* | wc -l)
          got=$(gh api "repos/$REPO/releases/$id" --jq '.assets | length')
          if [ "$got" -ne "$want" ]; then
            echo "::error::$TAG has $got of $want assets"
            exit 1
          fi
          if [ "$(gh api "repos/$REPO/releases/$id" --jq .immutable)" != true ]; then
            echo "::error::$TAG is not immutable; turn on immutable releases in the repository settings"
            exit 1
          fi

  # The GitHub Action end to end against the release just published: download,
  # sha256 check, collect, render. A release made with the built-in token
  # triggers no other workflow, so the check runs here.
  action:
    name: Action (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    # It runs the downloaded binary with the token: reading is all it needs.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./
        id: bonsai
        with:
          output-dir: out
          legend: left

      - name: Check the outputs
        shell: bash
        run: |
          for f in "${{ steps.bonsai.outputs.light }}" "${{ steps.bonsai.outputs.dark }}"; do
            test -s "$f" && grep -q '<svg' "$f" && grep -q '<text' "$f" || { echo "::error::$f is not a rendered SVG"; exit 1; }
          done
