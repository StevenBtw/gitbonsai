name: Release

# Releases are immutable, so binaries can only be attached while a release is a
# draft. Create the release in the GitHub UI as a draft (new tag vX.Y.Z on
# publish, target main) and save it unpublished: merging to main, or the Run
# workflow button, builds the binaries, attaches them and publishes the draft,
# which creates the tag. Pushing a bare tag works too: the draft is made here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build jobs run dependency build scripts, so only
# the jobs that read drafts or publish get write access.
permissions:
  contents: read

# A merge and a button press never publish the same draft twice.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which release this run fills: the pushed tag, or v<Cargo.toml version>.
  # A push to main without a draft for that version releases nothing.
  plan:
    name: Find the draft
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are listed only for tokens that can write.
      contents: write
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      go: ${{ steps.find.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The button would otherwise publish whatever branch it was pressed on.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::run the release from main, not $REF"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          else
            tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi
          state=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | if .draft then \"draft\" else \"published\" end")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$state" = draft ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = tag ] && [ "$state" = published ]; then
            echo "::error::release $tag is already published, so no binaries can be attached; create the release as a draft, not published"
            exit 1
          elif [ "$REF_TYPE" = tag ]; then
            echo "go=true" >> "$GITHUB_OUTPUT" # a bare tag: the release job makes the draft
          elif [ "$EVENT" = push ]; then
            echo "no draft release $tag, so this push releases nothing"
          else
            echo "::error::no draft release $tag; create it as a draft in the GitHub UI first"
            exit 1
          fi

  # Before anything is built: the tag, Cargo.toml, Cargo.lock, README, example
  # workflow and CHANGELOG all name the same version.
  version:
    name: Version agrees
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: bash scripts/check-version.sh "$TAG"
        env:
          TAG: ${{ needs.plan.outputs.tag }}

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # One archive per target with the binary at its root, plus its checksum:
      # gitbonsai-<target>.tar.gz (zip on Windows) and gitbonsai-<target>.<ext>.sha256
      - name: Package
        shell: bash
        run: |
          name="gitbonsai-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            (cd "$dir" && 7z a "../../../$archive" gitbonsai.exe > /dev/null)
            sha256sum "$archive" > "$archive.sha256"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" -C "$dir" gitbonsai
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    name: Publish the GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance for each binary, which the action verifies:
      # release assets can be replaced, so the checksum alone proves nothing
      # about where a binary came from.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: gitbonsai-*

      # The signed bundle ships with the binaries, so the action checks it
      # offline: no token permission is needed to read attestations.
      - name: Keep the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" gitbonsai-provenance.sigstore.json

      # Everything goes onto a draft, which is published only once it holds
      # every archive, checksum and the provenance bundle: publishing locks it.
      # A draft made by hand gets its tag on the commit just built; for a bare
      # tag the draft is made here.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REF_TYPE" = tag ] && ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "Release ${TAG#v}" --generate-notes
          elif [ "$REF_TYPE" != tag ]; then
            gh release edit "$TAG" --repo "$REPO" --target "$SHA"
          fi
          gh release upload "$TAG" gitbonsai-* --repo "$REPO" --clobber
          if ! diff <(ls gitbonsai-* | sort) <(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sort); then
            echo "::error::draft $TAG does not hold every binary, so it stays a draft"
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false

  # The GitHub Action end to end against the release just published: download,
  # sha256 check, collect, render. A release made with the built-in token
  # triggers no other workflow, so the check runs here.
  action:
    name: Action (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    # It runs the downloaded binary with the token: reading is all it needs.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./
        id: bonsai
        with:
          output-dir: out
          legend: left

      - name: Check the outputs
        shell: bash
        run: |
          for f in "${{ steps.bonsai.outputs.light }}" "${{ steps.bonsai.outputs.dark }}"; do
            test -s "$f" && grep -q '<svg' "$f" && grep -q '<text' "$f" || { echo "::error::$f is not a rendered SVG"; exit 1; }
          done

  # Last, once the binaries are attached and the Action works end to end:
  # the crate on crates.io, through trusted publishing (no stored token).
  # A version already there is skipped, so a rerun is safe.
  crates:
    name: Publish to crates.io
    needs: action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0

      - name: Already on crates.io?
        id: seen
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -sf -A "gitbonsai-release (GitHub Actions)" \
              "https://crates.io/api/v1/crates/gitbonsai/$version" > /dev/null; then
            echo "gitbonsai $version is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.seen.outputs.published != 'true'
        id: auth

      - name: Publish
        if: steps.seen.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
