name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lints (both feature sets), docs, typos and dependency policy
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The SVG-only build, without resvg
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Check docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Typos
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2

  # Tests on every platform the release ships to, and a hash of every
  # fixture's output in every style: the tree must be byte-identical everywhere
  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-test-

      - name: Test
        run: cargo test --all-features

      - name: Render the gallery
        run: cargo run --release --quiet -- gallery --output-dir gallery --quiet

      - name: Hash the outputs
        shell: bash
        run: |
          bash scripts/gallery-hashes.sh gallery > hashes-${{ matrix.os }}.txt
          sha256sum hashes-${{ matrix.os }}.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

      # The gallery from one platform, for design review on pull requests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gallery
          path: gallery/

  # The oldest Rust the crate claims (rust-version): it must build and pass.
  # rust-toolchain.toml pins newer, so the toolchain is named on the command.
  msrv:
    name: MSRV (1.88)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0

      - name: Test
        run: cargo +1.88.0 test --all-features --locked

  determinism:
    name: Byte-identical on every platform
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hashes-*
          merge-multiple: true

      - name: Compare
        run: |
          ls hashes-*.txt
          first=$(ls hashes-*.txt | head -1)
          status=0
          for f in hashes-*.txt; do
            if ! diff -q "$first" "$f" > /dev/null; then
              echo "::error::$f differs from $first"
              diff "$first" "$f" | head -20
              status=1
            fi
          done
          exit $status

      # Every change to how a tree looks shows up in the PR as a change to
      # gallery.sha256.
      - name: Compare with gallery.sha256
        run: |
          first=$(ls hashes-*.txt | head -1)
          if ! diff -u repo/gallery.sha256 "$first"; then
            echo "::error::the gallery changed; run scripts/gallery-hashes.sh > gallery.sha256 and commit it"
            exit 1
          fi
