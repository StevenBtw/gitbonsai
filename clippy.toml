# Platform math libraries differ in the last bits of these, which can flip how
# a serialized coordinate rounds. Use crate::math (libm) instead, so every
# platform draws the same tree. sqrt and the basic operators are exact.
disallowed-methods = [
  { path = "f64::powi", reason = "use math::sq or a product: identical output everywhere" },
  { path = "f64::powf", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::sin", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::cos", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::tan", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::exp", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::ln", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::atan2", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::hypot", reason = "use crate::math (libm): identical output everywhere" },
  { path = "f64::cbrt", reason = "use crate::math (libm): identical output everywhere" },
]
