# bonsai.toml: every key is optional; these are the defaults unless noted.

[tree]
# style = "moyogi"      # chokkan | moyogi | shakan | fukinagashi | kengai; unset, mostly the last three years pick it
# wind = "left"         # the side it leans and streams to; unset, its sprout picks it
# hemisphere = "south"  # seasons follow the southern hemisphere; unset, the northern

[leaves]
pins = []               # at most 5 languages, e.g. ["Rust", "Python"]; they take color slots first
other = "#9AA58A"       # every language outside the 5 named slots
private = "#B8BCC2"     # work GitHub reports without a language (private repos)

[leaves.private_periods] # optional: languages to show for private work
# "2019..2023" = ["Python"]        # whole years, or "2019-03..2021-06" for months

[leaves.colors]         # used verbatim, no foliage tint; names are GitHub's, case-sensitive
# Rust = "#C0703A"
# "C++" = "#4F7FA8"

[blossoms]
color = "#F4C7D3"

[pot]
# glaze = "#3E5C76"     # used from pot tier 3 up

[render]
animate = true
size = 400              # display width in px; the height follows the tree
legend = "off"          # "left" or "right": what the colors and signs mean
