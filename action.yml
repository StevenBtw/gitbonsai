name: gitbonsai
description:
  Grow a Japanese maple bonsai from a GitHub account's activity, as light and
  dark animated SVGs for a profile README.
branding:
  icon: feather
  color: green

inputs:
  login:
    description: Account whose bonsai to grow.
    default: ${{ github.repository_owner }}
  output-dir:
    description:
      Folder, relative to the workspace, that receives bonsai-light.svg,
      bonsai-dark.svg, bonsai.png and preview.html.
    default: bonsai
  style:
    description:
      moyogi, chokkan, shakan or fukinagashi; empty uses the config or the
      default (moyogi).
    default: ""
  legend:
    description:
      off, left or right; a legend beside the tree. Empty uses the config or
      the default (off).
    default: ""
  config:
    description: A bonsai.toml in the workspace; a missing file means defaults.
    default: bonsai.toml
  token:
    description:
      Token for reading the account's public data; the built-in token is enough.
    default: ${{ github.token }}

outputs:
  light:
    description: Path of the light SVG.
    value: ${{ steps.render.outputs.light }}
  dark:
    description: Path of the dark SVG.
    value: ${{ steps.render.outputs.dark }}

runs:
  using: composite
  steps:
    - name: Download the gitbonsai release this action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *)
            echo "gitbonsai has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        archive="gitbonsai-$target.tar.gz"
        install_dir="$RUNNER_TEMP/gitbonsai"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256" --clobber; then
          echo "release v$version has no asset $archive; reference the action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        tar -xzf "$archive"
        echo "$install_dir" >> "$GITHUB_PATH"
    - name: Collect the account's activity
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BONSAI_LOGIN: ${{ inputs.login }}
      run: gitbonsai collect "$BONSAI_LOGIN" --output "$RUNNER_TEMP/bonsai.snapshot.json"
    - name: Grow the bonsai
      id: render
      shell: bash
      env:
        BONSAI_OUTPUT_DIR: ${{ inputs.output-dir }}
        BONSAI_STYLE: ${{ inputs.style }}
        BONSAI_LEGEND: ${{ inputs.legend }}
        BONSAI_CONFIG: ${{ inputs.config }}
      run: |
        # Style and legend override the config only when given.
        args=(--output-dir "$BONSAI_OUTPUT_DIR" --config "$BONSAI_CONFIG")
        if [ -n "$BONSAI_STYLE" ]; then
          args+=(--style "$BONSAI_STYLE")
        fi
        if [ -n "$BONSAI_LEGEND" ]; then
          args+=(--legend "$BONSAI_LEGEND")
        fi
        gitbonsai render "$RUNNER_TEMP/bonsai.snapshot.json" "${args[@]}"
        echo "light=$BONSAI_OUTPUT_DIR/bonsai-light.svg" >> "$GITHUB_OUTPUT"
        echo "dark=$BONSAI_OUTPUT_DIR/bonsai-dark.svg" >> "$GITHUB_OUTPUT"
