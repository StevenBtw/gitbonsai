name: gitbonsai
description:
  Grow a Japanese maple bonsai from a GitHub account's activity, as light and
  dark animated SVGs for a profile README.
branding:
  icon: feather
  color: green

inputs:
  login:
    description: Account whose bonsai to grow.
    default: ${{ github.repository_owner }}
  output-dir:
    description:
      Folder, relative to the workspace, that receives bonsai-light.svg,
      bonsai-dark.svg, bonsai.png and preview.html.
    default: bonsai
  style:
    description:
      moyogi, chokkan, shakan or fukinagashi; empty uses the config or the
      default (moyogi).
    default: ""
  legend:
    description:
      off, left or right; a legend beside the tree. Empty uses the config or
      the default (off).
    default: ""
  config:
    description: A bonsai.toml in the workspace; a missing bonsai.toml means defaults, any other missing file a warning.
    default: bonsai.toml
  snapshot:
    description:
      Where the collected history is kept, relative to the workspace; empty
      means bonsai.snapshot.json in output-dir. Commit it, and the next run
      fetches only recent months instead of the whole history.
    default: ""
  full:
    description:
      true fetches the whole history again instead of only recent months; use
      it once after turning private contributions on or off in your profile.
    default: "false"
  token:
    description:
      Token for reading the account's public data; the built-in token is
      enough. The snapshot is committed with the SVGs, so a token that sees
      private repositories would publish their languages and archived names.
    default: ${{ github.token }}

outputs:
  light:
    description: Path of the light SVG.
    value: ${{ steps.render.outputs.light }}
  dark:
    description: Path of the dark SVG.
    value: ${{ steps.render.outputs.dark }}
  snapshot:
    description: Path of the snapshot, to commit with the SVGs.
    value: ${{ steps.collect.outputs.snapshot }}

runs:
  using: composite
  steps:
    - name: Download the gitbonsai release this action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *)
            echo "gitbonsai has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        archive="gitbonsai-$target.tar.gz"
        install_dir="$RUNNER_TEMP/gitbonsai"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256" --clobber; then
          echo "release v$version has no asset $archive; reference the action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        # Where it came from: the signed build provenance this repository's
        # release workflow made for it. The sha256 below only shows it arrived
        # intact.
        if ! gh attestation verify "$archive" --repo "$repository"; then
          echo "$archive has no build provenance from $repository" >&2
          exit 1
        fi
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        tar -xzf "$archive"
        echo "$install_dir" >> "$GITHUB_PATH"
    - name: Collect the account's activity
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BONSAI_LOGIN: ${{ inputs.login }}
        BONSAI_SNAPSHOT: ${{ inputs.snapshot }}
        BONSAI_OUTPUT_DIR: ${{ inputs.output-dir }}
        BONSAI_FULL: ${{ inputs.full }}
      run: |
        # A snapshot from an earlier run of this version is reused: only
        # recent months are fetched again, unless full is true.
        snapshot="${BONSAI_SNAPSHOT:-$BONSAI_OUTPUT_DIR/bonsai.snapshot.json}"
        mkdir -p "$(dirname "$snapshot")"
        args=(--output "$snapshot")
        if [ "$BONSAI_FULL" = true ]; then
          args+=(--full)
        fi
        gitbonsai collect "$BONSAI_LOGIN" "${args[@]}"
        echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
    - name: Grow the bonsai
      id: render
      shell: bash
      env:
        BONSAI_OUTPUT_DIR: ${{ inputs.output-dir }}
        BONSAI_STYLE: ${{ inputs.style }}
        BONSAI_LEGEND: ${{ inputs.legend }}
        BONSAI_CONFIG: ${{ inputs.config }}
        BONSAI_SNAPSHOT: ${{ steps.collect.outputs.snapshot }}
      run: |
        # Style and legend override the config only when given.
        args=(--output-dir "$BONSAI_OUTPUT_DIR")
        # A config named in the inputs that is missing gets a warning; the
        # default bonsai.toml may simply not exist.
        if [ "$BONSAI_CONFIG" != bonsai.toml ] || [ -f "$BONSAI_CONFIG" ]; then
          args+=(--config "$BONSAI_CONFIG")
        fi
        if [ -n "$BONSAI_STYLE" ]; then
          args+=(--style "$BONSAI_STYLE")
        fi
        if [ -n "$BONSAI_LEGEND" ]; then
          args+=(--legend "$BONSAI_LEGEND")
        fi
        gitbonsai render "$BONSAI_SNAPSHOT" "${args[@]}"
        echo "light=$BONSAI_OUTPUT_DIR/bonsai-light.svg" >> "$GITHUB_OUTPUT"
        echo "dark=$BONSAI_OUTPUT_DIR/bonsai-dark.svg" >> "$GITHUB_OUTPUT"
